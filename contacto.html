    <main>
        <h2>Contacto</h2>
        <ul>
            <li><strong>Dirección:</strong> Calle de las Flores 123, Ciudad Verde</li>
            <li><strong>Teléfono:</strong> <a href="tel:+123456789">+1 234 567 89</a></li>
            <li><strong>Correo:</strong> <a href="mailto:contacto@jardinencantado.com">contacto@jardinencantado.com</a></li>
        </ul>

        <form action="#" method="post">
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" placeholder="Escriba su nombre" required>
            </p>
            <p>
                <label for="email">Correo:</label><br>
                <input type="email" id="email" name="email" placeholder="Escriba su correo" required>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" placeholder="Escriba su mensaje" required></textarea>
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
